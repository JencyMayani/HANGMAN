<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hangman</title>
    <link rel="stylesheet" href="hangman.css">
    <script src="hangman.js" defer></script>
</head>

<body>
    <div>
        <img src="images/hangman6.gif" alt="Picture of Hangman">
    </div>

    <div id="clue">
        Press New Game to play
    </div>

    <div>
        <input id="guess" type="text" size="1" maxlength="1">
        <button onclick="guess();">Guess</button>
    </div>

    <div id="newgamearea">
        <button onclick="newgame();">New Game</button>
    </div>

    <div id="guesses"></div>

</body>
</html>
